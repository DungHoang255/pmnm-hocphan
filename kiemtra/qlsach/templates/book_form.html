{% extends 'base.html' %}

{% block title %}
{{ 'Sửa' if book else 'Thêm' }} sách
{% endblock %}

{% block content %}

<h1>
    {{ 'Sửa' if book else 'Thêm' }} sách
</h1>

<form class="panel edit-form" method="post">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="title">
        Tên sách
        <span class="required">*</span>
    </label>

    <input id="title" name="title" maxlength="200" required
        value="{{ request.form.get('title', book.title if book else '') }}">

    <label for="author">
        Tác giả
        <span class="required">*</span>
    </label>

    <input id="author" name="author" maxlength="150" required
        value="{{ request.form.get('author', book.author if book else '') }}">

    <label for="category_id">
        Danh mục
        <span class="required">*</span>
    </label>

    {% set chosen_category = request.form.get(
    'category_id',
    book.category_id | string if book else ''
    ) %}

    <select id="category_id" name="category_id" required>

        <option value="">
            -- Chọn danh mục --
        </option>

        {% for category in categories %}

        <option value="{{ category.id }}" {% if chosen_category | string==category.id | string %} selected {% endif %}>
            {{ category.name }}
        </option>

        {% endfor %}

    </select>

    <label for="price">
        Giá (VND)
        <span class="required">*</span>
    </label>

    <input id="price" name="price" type="number" min="0" max="1000000000000" step="0.01" required
        value="{{ request.form.get('price', book.price if book else '0') }}">

    <label for="quantity">
        Số lượng
        <span class="required">*</span>
    </label>

    <input id="quantity" name="quantity" type="number" min="0" max="1000000000" step="1" required
        value="{{ request.form.get('quantity', book.quantity if book else '0') }}">

    <div class="form-buttons">

        <button class="btn" type="submit">
            Lưu
        </button>

        <a class="btn secondary" href="{{ url_for('books') }}">
            Hủy
        </a>

    </div>
</form>

{% endblock %}
