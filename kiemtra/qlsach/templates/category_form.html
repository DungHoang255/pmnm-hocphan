{% extends 'base.html' %}

{% block title %}
{{ 'Sửa' if category else 'Thêm' }} danh mục
{% endblock %}

{% block content %}

<h1>
    {{ 'Sửa' if category else 'Thêm' }} danh mục
</h1>

<form class="panel edit-form" method="post">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="name">
        Tên danh mục
        <span class="required">*</span>
    </label>

    <input id="name" name="name" maxlength="100" required
        value="{{ request.form.get('name', category.name if category else '') }}"
        placeholder="Ví dụ: Công nghệ thông tin">

    <label for="description">
        Mô tả
    </label>

    <textarea id="description" name="description" maxlength="500" rows="4"
        placeholder="Mô tả ngắn">{{ request.form.get('description', category.description if category else '') }}</textarea>

    <div class="form-buttons">

        <button class="btn" type="submit">
            Lưu
        </button>

        <a class="btn secondary" href="{{ url_for('categories') }}">
            Hủy
        </a>

    </div>
</form>

{% endblock %}
