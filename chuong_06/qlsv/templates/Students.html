<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h2>DANH SÁCH SINH VIÊN</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>MSSV</th>
                <th>Họ và Tên</th>
                <th>Điểm GPA</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.mssv }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.gpa }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">Chưa có dữ liệu sinh viên. Hãy mở <a
                        href="/them-mau">/them-mau</a> để tạo dữ liệu.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
